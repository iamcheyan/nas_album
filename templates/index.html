<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NAS Album</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- SVG Sprite -->
    <svg style="display:none">
        <defs>
            <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
            <symbol id="icon-images" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
            <symbol id="icon-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></symbol>
            <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
            <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
            <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
            <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
            <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.68 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
            <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
            <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
            <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></symbol>
            <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
            <symbol id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
            <symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 21 18 21 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></symbol>
            <symbol id="icon-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
            <symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
            <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
            <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
            <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
            <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
            <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
            <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
            <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
            <symbol id="icon-github" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></symbol>
            <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
        </defs>
    </svg>

    <!-- 移动端汉堡菜单按钮 -->
    <button id="sidebar-toggle" class="sidebar-toggle" data-i18n-aria-label="nav.gallery" aria-label="打开侧边栏">
        <svg width="20" height="20"><use href="#icon-menu"/></svg>
    </button>

    <!-- 侧边栏遮罩 -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-container">
        <!-- 左侧边栏 -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2><svg width="20" height="20" style="vertical-align:-3px;margin-right:6px"><use href="#icon-camera"/></svg>NAS Album</h2>
            </div>

            <nav class="sidebar-nav">
                <!-- 图库分组 -->
                <div class="sidebar-group">
                    <div class="sidebar-group-title" data-i18n="nav.gallery">图库</div>
                    <ul class="sidebar-list">
                        <li class="sidebar-item active" data-view="all">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-images"/></svg>
                            <span class="sidebar-label" data-i18n="nav.all">全部</span>
                            <span class="sidebar-count" id="count-all"></span>
                        </li>
                        <li class="sidebar-item" data-view="photos">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-camera"/></svg>
                            <span class="sidebar-label" data-i18n="nav.photos">照片</span>
                            <span class="sidebar-count" id="count-photos"></span>
                        </li>
                        <li class="sidebar-item" data-view="videos">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-video"/></svg>
                            <span class="sidebar-label" data-i18n="nav.videos">视频</span>
                            <span class="sidebar-count" id="count-videos"></span>
                        </li>
                        <li class="sidebar-item" data-view="favorites">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-star"/></svg>
                            <span class="sidebar-label" data-i18n="nav.favorites">收藏</span>
                            <span class="sidebar-count" id="count-favorites"></span>
                        </li>
                        <li class="sidebar-item" data-view="recent">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-clock"/></svg>
                            <span class="sidebar-label" data-i18n="nav.recent">最近添加</span>
                        </li>
                        <li class="sidebar-item" data-view="trash">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-trash"/></svg>
                            <span class="sidebar-label" data-i18n="nav.trash">最近删除</span>
                            <span class="sidebar-count" id="count-trash"></span>
                        </li>
                        <li class="sidebar-item" data-view="hidden">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-eye-off"/></svg>
                            <span class="sidebar-label" data-i18n="nav.hidden">隐藏照片</span>
                            <span class="sidebar-count" id="count-hidden"></span>
                        </li>
                        <li class="sidebar-item" data-view="duplicates">
                            <svg class="sidebar-icon" width="18" height="18"><use href="#icon-alert"/></svg>
                            <span class="sidebar-label" data-i18n="nav.duplicates">重复照片</span>
                            <span class="sidebar-count" id="count-duplicates"></span>
                        </li>
                    </ul>
                </div>

                <!-- 相册分组 -->
                <div class="sidebar-group">
                    <div class="sidebar-group-title">
                        <span data-i18n="nav.albums">相册</span>
                        <button id="new-album-btn" class="sidebar-action-btn" data-i18n-title="nav.newAlbum" title="新建相册">
                            <svg width="14" height="14"><use href="#icon-plus"/></svg>
                        </button>
                    </div>
                    <ul class="sidebar-list" id="albums-list">
                        <!-- 动态插入 -->
                    </ul>
                </div>

                <!-- 来源分组 -->
                <div class="sidebar-group">
                    <div class="sidebar-group-title" data-i18n="nav.sources">来源</div>
                    <ul class="sidebar-list" id="sources-list">
                        <!-- 动态插入 -->
                    </ul>
                </div>

                <!-- 时间轴分组 -->
                <div class="sidebar-group">
                    <div class="sidebar-group-title" data-i18n="nav.timeline">时间轴</div>
                    <ul class="sidebar-list" id="timeline-list">
                        <!-- 动态插入年份/月份树 -->
                    </ul>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <div class="main-area">
            <!-- 顶部 Tab 栏 -->
            <header class="top-bar">
                <div class="top-tabs">
                    <button class="top-tab active" data-tab="all" data-i18n="tab.all">全部</button>
                    <button class="top-tab" data-tab="years" data-i18n="tab.years">年份</button>
                    <button class="top-tab" data-tab="map" data-i18n="tab.map">地图</button>
                    <button class="top-tab" data-tab="dbinfo" data-i18n="tab.dbinfo">数据库信息</button>
                </div>
                <div class="top-actions">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16"><use href="#icon-search"/></svg>
                        <input type="text" id="search-input" data-i18n-placeholder="action.search" placeholder="搜索照片...">
                    </div>
                    <a href="https://github.com/iamcheyan/nas_album" target="_blank" rel="noopener noreferrer" class="icon-btn" title="GitHub">
                        <svg width="18" height="18"><use href="#icon-github"/></svg>
                    </a>
                    <button id="settings-btn" class="icon-btn" data-i18n-title="action.settings" title="设置">
                        <svg width="18" height="18"><use href="#icon-settings"/></svg>
                    </button>
                </div>
            </header>

            <!-- 批量选择工具栏 -->
            <div id="selection-bar" class="selection-bar">
                <span id="selection-count" data-i18n="status.selectedCount" data-i18n-args="0">已选择 0 张</span>
                <div class="selection-actions">
                    <button id="batch-delete-btn" class="btn btn-danger" disabled data-i18n="action.delete">删除</button>
                    <button id="cancel-selection-btn" class="btn btn-secondary" data-i18n="action.cancel">取消</button>
                </div>
            </div>

            <!-- 重复照片操作栏 -->
            <div id="duplicates-bar" class="duplicates-bar hidden">
                <span id="duplicates-count">已标记 0 个文件待删除</span>
                <button id="duplicates-delete-btn" class="btn btn-danger" data-i18n="duplicates.deleteMarked">删除标记项</button>
            </div>

            <!-- 视图标题栏 -->
            <div class="view-header">
                <h1 id="view-title" data-i18n="title.allPhotos">全部照片</h1>
                <div class="view-actions">
                    <button id="select-mode-btn" class="btn btn-secondary" data-i18n="action.select">选择</button>
                    <select id="photo-filter-type" class="photo-filter-select">
                        <option value="all" data-i18n="filter.all">全部</option>
                        <option value="photo" data-i18n="filter.photo">照片</option>
                        <option value="screenshot" data-i18n="filter.screenshot">截图</option>
                    </select>
                    <!-- 缩略图尺寸调节 -->
                    <div class="thumb-size-control">
                        <svg class="thumb-size-icon" width="14" height="14"><use href="#icon-search"/></svg>
                        <input type="range" id="thumb-size-slider" min="80" max="400" value="200" step="10">
                        <span id="thumb-size-value">200px</span>
                    </div>
                </div>
            </div>

            <!-- 照片网格主区域 -->
            <main id="timeline" class="timeline-main">
                <!-- 照片将通过 JS 动态插入 -->
            </main>

            <div id="loading" class="loading" data-i18n="status.loadingMore">加载更多...</div>

            <!-- 底部状态栏 -->
            <footer class="status-bar">
                <span id="status-text" data-i18n="status.totalCount" data-i18n-args="0">共 0 个项目</span>
                <span id="scan-status"></span>
            </footer>
        </div>
    </div>

    <!-- Fot 风格图片查看器 -->
    <div id="viewer" class="viewer hidden">
        <!-- 主媒体区 -->
        <div class="viewer-main">
            <button class="viewer-close" data-i18n-title="action.close" title="关闭 (Esc)">
                <svg width="20" height="20"><use href="#icon-close"/></svg>
            </button>
            <button class="viewer-nav viewer-prev" data-i18n-title="action.prev" title="上一张 (←)">
                <svg width="24" height="24"><use href="#icon-chevron-left"/></svg>
            </button>
            <button class="viewer-nav viewer-next" data-i18n-title="action.next" title="下一张 (→)">
                <svg width="24" height="24"><use href="#icon-chevron-right"/></svg>
            </button>
            <!-- 移动端信息面板切换按钮 -->
            <button class="viewer-info-toggle" data-i18n-title="action.info" title="详细信息">
                <svg width="20" height="20"><use href="#icon-info"/></svg>
            </button>
            <div class="viewer-media-wrap">
                <div id="viewer-media-container"></div>
            </div>
            <div class="viewer-counter">
                <span id="viewer-index"></span>
            </div>
        </div>

        <!-- 右侧信息面板 -->
        <div class="viewer-sidebar" id="viewer-sidebar">
            <div class="viewer-sidebar-header">
                <span><svg width="16" height="16" style="vertical-align:-2px;margin-right:4px"><use href="#icon-info"/></svg><span data-i18n="exif.details">详细信息</span></span>
                <div style="display:flex;gap:8px">
                    <button class="viewer-delete-btn icon-btn" data-i18n-title="action.delete" title="删除 (Delete)">
                        <svg width="18" height="18"><use href="#icon-trash"/></svg>
                    </button>
                    <button class="viewer-sidebar-toggle" data-i18n-title="action.collapse" title="收起面板">
                        <svg width="16" height="16"><use href="#icon-chevron-right"/></svg>
                    </button>
                </div>
            </div>
            <div class="viewer-exif" id="viewer-exif">
                <div class="exif-loading" data-i18n="exif.loading">加载信息中...</div>
            </div>
        </div>

        <!-- 底部缩略图条 -->
        <div class="viewer-filmstrip">
            <div class="filmstrip-inner" id="filmstrip-inner"></div>
        </div>
    </div>

    <!-- 自定义对话框 -->
    <div id="custom-dialog" class="custom-dialog hidden">
        <div class="dialog-overlay"></div>
        <div class="dialog-box">
            <div class="dialog-icon" id="dialog-icon">
                <svg width="32" height="32"><use href="#icon-alert"/></svg>
            </div>
            <h3 class="dialog-title" id="dialog-title" data-i18n="dialog.tip">提示</h3>
            <p class="dialog-message" id="dialog-message"></p>
            <div class="dialog-actions" id="dialog-actions">
                <button class="btn btn-secondary" id="dialog-cancel" data-i18n="action.cancel">取消</button>
                <button class="btn btn-primary" id="dialog-confirm" data-i18n="action.confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast hidden">
        <span id="toast-message"></span>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-overlay"></div>
        <div class="settings-box">
            <div class="settings-header">
                <h3 data-i18n="settings.title">设置</h3>
                <button id="settings-close" class="icon-btn">
                    <svg width="18" height="18"><use href="#icon-close"/></svg>
                </button>
            </div>
            <div class="settings-content">
                <!-- Language Selector -->
                <div class="settings-section">
                    <h4 data-i18n="settings.language">语言</h4>
                    <div class="lang-selector">
                        <button class="lang-btn active" data-lang="zh">
                            <span class="lang-flag">🇨🇳</span>
                            <span class="lang-name">中文</span>
                        </button>
                        <button class="lang-btn" data-lang="en">
                            <span class="lang-flag">🇺🇸</span>
                            <span class="lang-name">English</span>
                        </button>
                        <button class="lang-btn" data-lang="ja">
                            <span class="lang-flag">🇯🇵</span>
                            <span class="lang-name">日本語</span>
                        </button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4 data-i18n="settings.mapProvider">地图提供商</h4>
                    <div class="map-provider-selector">
                        <button class="map-provider-btn" data-provider="amap">
                            <span class="provider-name" data-i18n="mapProvider.amap">高德地图</span>
                        </button>
                        <button class="map-provider-btn" data-provider="osm">
                            <span class="provider-name" data-i18n="mapProvider.osm">OpenStreetMap</span>
                        </button>
                        <button class="map-provider-btn" data-provider="cartoDark">
                            <span class="provider-name" data-i18n="mapProvider.cartoDark">CartoDB Dark</span>
                        </button>
                        <button class="map-provider-btn" data-provider="cartoLight">
                            <span class="provider-name" data-i18n="mapProvider.cartoLight">CartoDB Light</span>
                        </button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4 data-i18n="settings.dataMaintenance">数据维护</h4>
                    <div class="settings-item">
                        <div class="settings-item-info">
                            <div class="settings-item-title" data-i18n="settings.gpsBackfill">GPS 数据补录</div>
                            <div class="settings-item-desc" data-i18n="settings.gpsBackfillDesc">从照片 EXIF 中提取 GPS 信息并写入数据库</div>
                        </div>
                        <button id="backfill-gps-btn" class="btn btn-primary" data-i18n="settings.startBackfill">开始补录</button>
                    </div>
                    <div id="backfill-gps-progress" class="backfill-progress hidden">
                        <div class="progress-bar">
                            <div class="progress-fill" id="backfill-gps-fill"></div>
                        </div>
                        <div class="progress-text" id="backfill-gps-text">0 / 0</div>
                    </div>
                    <div class="settings-item">
                        <div class="settings-item-info">
                            <div class="settings-item-title" data-i18n="settings.scanDuplicates">扫描重复照片</div>
                            <div class="settings-item-desc" data-i18n="settings.scanDuplicatesDesc">扫描照片库中的重复文件，结果可在重复照片页面查看</div>
                        </div>
                        <button id="scan-duplicates-btn" class="btn btn-primary" data-i18n="settings.startScan">开始扫描</button>
                    </div>
                    <div id="scan-duplicates-result" class="permission-result hidden"></div>
                    <div class="settings-item">
                        <div class="settings-item-info">
                            <div class="settings-item-title" data-i18n="settings.permissionCheck">文件权限检查</div>
                            <div class="settings-item-desc" data-i18n="settings.permissionCheckDesc">检查照片目录的读写权限，删除功能需要写权限</div>
                        </div>
                        <button id="check-permission-btn" class="btn btn-primary" data-i18n="settings.checkPermission">检查权限</button>
                    </div>
                    <div id="permission-result" class="permission-result hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script>
        // Initialize i18n before app.js loads
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initI18n === 'function') initI18n();
        });
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
